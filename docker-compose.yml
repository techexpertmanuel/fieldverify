services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldverify
      POSTGRES_USER: fieldverify
      POSTGRES_PASSWORD: fieldverify
    ports:
      - "5432:5432"
    volumes:
      - fieldverify_pg:/var/lib/postgresql/data

volumes:
  fieldverify_pg:
